<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Princess 💖</title>

<style>
body{margin:0;background:black;color:white;font-family:Arial;overflow-x:hidden}

/* BACKGROUND */
#bg{position:fixed;width:100%;height:100%;z-index:-5;background:radial-gradient(circle,#1a001a,#000)}

/* PAGE */
.page{
position:absolute;
width:100%;height:100vh;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
opacity:0;
transition:0.6s;
pointer-events:none;
}
.page.active{opacity:1;pointer-events:auto}

/* BUTTON */
button{
padding:12px 25px;
border:none;
border-radius:30px;
margin:10px;
font-size:18px;
cursor:pointer;
background:#ff4da6;
color:white;
}

/* SLIDER */
.slider{width:320px;overflow:hidden;border-radius:20px}
.slides{display:flex;transition:0.6s}
.slides img{width:320px;height:320px;object-fit:cover}

/* FIREWORK */
canvas{position:fixed;top:0;left:0;z-index:-1}

/* HIDDEN SECTIONS */
#pizza,#choco,#finalEnd{display:none}

/* ANIMATION TEXT */
.glow{color:pink;text-shadow:0 0 10px pink}
</style>
</head>

<body>

<canvas id="fire"></canvas>

<!-- PAGE 1 -->
<div class="page active" id="p1">
<h1>Welcome Princess 👑💖</h1>
<button onclick="go('good')">Good 💖</button>
<button onclick="go('bad')">Bad 😢</button>
</div>

<!-- BAD -->
<div class="page" id="bad">
<h1>Don’t be sad 🥺💖</h1>
<button onclick="go('good')">I’m Good 💖</button>
</div>

<!-- GOOD -->
<div class="page" id="good">
<h2 class="glow">How cute are you 💖</h2>

<div class="slider">
<div class="slides" id="slides">
<img src="image1.jpg">
<img src="image2.jpg">
<img src="image3.jpg">
<img src="image4.jpg">
<img src="image5.jpg">
<img src="image6.jpg">
<img src="image7.jpg">
<img src="image8.jpg">
<img src="image9.jpg">
<img src="image10.jpg">
<img src="image11.jpg">
<img src="image12.jpg">
<img src="image13.jpg">
<img src="image14.jpg">
<img src="image15.jpg">
</div>
</div>

<button onclick="go('final')">Yes 💖</button>
</div>

<!-- FINAL START -->
<div class="page" id="final">

<div id="final1">
<h1 class="glow">WOW Aakriti 💖👑</h1>
<p>Na chaand ki chahat ✨ Har janam tu meri 💖</p>

<button onclick="playMusic()">Play Music 🎶</button>
<audio id="music" src="music.mp3"></audio>
</div>

<!-- PIZZA -->
<div id="pizza">
<h1>🍕 Pizza Surprise!</h1>
</div>

<!-- CHOCOLATE -->
<div id="choco">
<h1>🍫 Dairy Milk Unwrapping...</h1>
</div>

<!-- FINAL END -->
<div id="finalEnd">
<h1 class="glow">I LOVE YOU MY PRINCESS 💖👑</h1>
<button onclick="goFinal()">LET'S GO 🚀</button>
</div>

</div>

<script>

function go(id){
document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
document.getElementById(id).classList.add("active");
}

/* SLIDER */
let i=0;
setInterval(()=>{
let s=document.getElementById("slides");
if(s){i=(i+1)%15;s.style.transform=`translateX(-${i*320}px)`}
},1800);

/* MUSIC FLOW */
function playMusic(){
let m=document.getElementById("music");
m.play();

/* AFTER MUSIC ENDS */
m.onended=function(){
document.getElementById("final1").style.display="none";
document.getElementById("pizza").style.display="flex";

setTimeout(()=>{
document.getElementById("pizza").style.display="none";
document.getElementById("choco").style.display="flex";
},3000);

setTimeout(()=>{
document.getElementById("choco").style.display="none";
document.getElementById("finalEnd").style.display="flex";
},6000);
}
}

/* FINAL FIREWORK */
function goFinal(){
alert("I LOVE YOU 💖🔥");
}

/* SIMPLE FIREWORK */
let c=document.getElementById("fire");
let x=c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;

setInterval(()=>{
x.fillStyle="rgba(0,0,0,0.2)";
x.fillRect(0,0,c.width,c.height);
for(let i=0;i<20;i++){
x.fillStyle="hsl("+Math.random()*360+",100%,60%)";
x.beginPath();
x.arc(Math.random()*c.width,Math.random()*c.height,2,0,Math.PI*2);
x.fill();
}
},200);

</script>

</body>
</html>
